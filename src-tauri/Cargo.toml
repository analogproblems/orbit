[package]
name = "orbit"
version = "0.2.0"
description = "A workspace for Codex pull request reviews"
edition = "2021"
license = "Apache-2.0"
# There are two programs; `cargo run` and `tauri dev` start the desktop app.
default-run = "orbit"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
]
# Orbit without a window. Off by default, so the desktop app's bundles don't
# carry a second program that has no browser page beside it.
server = []

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
regex = "1"
sha2 = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
keyring = "4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
pulldown-cmark = { version = "0.13.4", default-features = false }

[[bin]]
name = "orbit"
path = "src/main.rs"
required-features = ["desktop"]

# Orbit without a window, for a computer that stays on. It needs no Tauri.
[[bin]]
name = "orbit-server"
path = "src/bin/orbit-server.rs"
required-features = ["server"]

[[test]]
name = "server"
path = "tests/server.rs"
required-features = ["server"]
