# Runs what `npm run check` runs on every pull request and on each push to
# master: lint, the build, the frontend tests, the Rust tests and the desktop
# build check. Each part is its own step, so a failure names the part that
# failed. Keep the steps in step with the `check` script in package.json.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops the run for its older commit. Each push to
# master keeps its own run, so every commit there has a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: npm run test:rust

      - name: Desktop build check
        run: npm run check:desktop
